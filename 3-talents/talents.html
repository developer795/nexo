  <!-- HEADER -->
  <header class="header">

      <a class="logo" href="../1-home/home.html" aria-label="NEXO">
        <img src="../src/assets/avatars/nexo.png" alt="NEXO" />
      </a>

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="القائمة"
        aria-controls="navLinks"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-links" id="navLinks" aria-label="التنقل الرئيسي">

        id="loginBtn"
        type="button"
      >
        تسجيل دخول
      </button>

  </header>


  <main>

    <div class="container">

      <!-- PAGE TITLE -->
      <div class="page-head">
        <h1>استكشف المواهب</h1>

        <p>
          تعرّف على المواهب في مختلف الرياضات الإلكترونية
        </p>
      </div>


      <!-- FILTERS -->
      <div class="filters">

        <div
          class="tabs"
          id="tabs"
        ></div>


        <div class="selects">

          <select
            class="select"
            id="cityFilter"
            aria-label="المدينة"
          >
            <option value="">المدينة</option>
          </select>


          <select
            class="select"
            id="statusFilter"
            aria-label="حالة التوفر"
          >
            <option value="">حالة التوفر</option>
            <option value="seeking">يبحث عن فريق</option>
            <option value="joined">منضم لفريق</option>
          </select>

        </div>

      </div>


      <!-- REAL TALENT ACCOUNTS WILL APPEAR HERE -->
      <div
        class="cards-grid"
        id="grid"
      ></div>

    </div>

  </main>


  <!-- FOOTER -->

    <div class="container footer-content">

      <div class="footer-main-logo">

        © 2026 NEXO. جميع الحقوق محفوظة

      <a href="mailto:Nexo.team5@gmail.com">
        Nexo.team5@gmail.com
