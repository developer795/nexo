<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO – نموذج بروفايل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.6}
header{display:flex;align-items:center;gap:22px;height:68px;padding:0 max(16px,calc((100% - 940px)/2));border-bottom:1px solid #e6e6ec;background:#fff}
.logo{font:700 26px Impact,"Arial Black",sans-serif;letter-spacing:2px;color:#1b1a48}
.search{width:250px;height:36px;border-radius:99px;background:#f6f6f6;box-shadow:0 2px 8px rgba(0,0,0,.06);color:#9a9aa0;font-size:12px;display:flex;align-items:center;padding:0 16px}
header nav{display:flex;gap:30px;font-size:13px;color:#9a9aa0;margin-inline-start:10px;flex:1}
header nav a{padding:22px 0}header nav a.on{color:#000;font-weight:700;border-bottom:2px solid #b7efc2}
.ph{width:38px;height:38px;border-radius:8px;background:#e4e4ea;flex:none}
main{max-width:640px;margin:0 auto;padding:30px 16px 70px}
.bc{font-size:11px;color:#9a9aa0;margin-bottom:22px}.bc b{color:#000}
.card{position:relative;background:#fff;border:1px solid #e6e6ec;border-radius:6px;margin-bottom:14px;overflow:hidden}
.pad{padding:18px 14px 0}
.cover{height:115px;background:#111}
.head{position:relative;padding:0 14px 12px}
.head .ph{width:74px;height:70px;border-radius:8px;margin-top:-34px;border:0;background:#e4e4ea}
.name{font-size:26px;font-weight:700;line-height:1.3;margin-top:6px}
.line{display:flex;align-items:center;gap:8px}.role{font-size:20px}
.loc{font-size:9px;color:#9a9aa0}
.tag{font-size:8px;padding:1px 10px;border-radius:99px;background:#b9b9c9;color:#222}
.green{background:#e0f7e4;color:#0aa043;font-weight:700}.yel{background:#fcf8a6;color:#c1b400;font-weight:700}
.status{position:absolute;left:14px;top:6px;font-size:9px;padding:4px 14px}
.pen{position:absolute;top:12px;left:14px;font-size:14px;color:#8a8a96}
.stats{display:flex;border-top:1px solid #e6e6ec;height:62px}
.stats>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:700;border-inline-start:1px solid #e6e6ec}
.stats>div:first-child{border:0}.stats b{font-size:12px}
.ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(#0aa043 0%,#e6e6ec 0);display:grid;place-items:center;margin-bottom:2px}
.ring i{width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font:normal 8px inherit;color:#0aa043}
.btn{background:#201f4a;color:#fff;border:0;border-radius:99px;font:600 9px inherit;padding:6px 20px;cursor:pointer}
.btn.o{background:#fff;color:#201f4a;border:1px solid #201f4a}
h2{font-size:24px;margin:0;line-height:1.3}.cnt{color:#9a9aa0;font-weight:700;font-size:12px}
.sec{padding:16px 12px 0;position:relative}
.hd{display:flex;justify-content:space-between;align-items:flex-start}.hd .btn{margin-top:4px}
.about{font-size:9.5px;margin:10px 2px 14px;line-height:1.7}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 0}
.post{border:1px solid #e6e6ec;border-radius:6px;padding:10px;min-height:260px}
.pt{display:flex;gap:8px;align-items:flex-start}.pt .ph{width:36px;height:36px}.pt b{font-size:12px;display:block;line-height:1.3}.pt small{display:block;font-size:8px;color:#9a9aa0}
.post p{font-size:7.5px;margin:12px 0 0;line-height:1.7}
.more{border-top:1px solid #e6e6ec;margin:14px -12px 0;text-align:center;padding:12px;font-size:11px;font-weight:600;color:#201f4a}
.item{border:1px solid #e6e6ec;border-radius:6px;padding:12px;margin-top:12px;display:flex;gap:12px;align-items:center}.item .ph{width:54px;height:54px}
.item b{font-size:13px;display:block}.item small{display:block;color:#9a9aa0;font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .card{margin:0}
.lnk{display:block;text-align:center;border:1px solid #201f4a;border-radius:99px;padding:5px;margin:12px 20px 0;color:#201f4a;font-weight:700;font-size:12px}
.plat{border:1px solid #e6e6ec;border-radius:6px;padding:10px 12px;margin-top:14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.plat .tag{margin-inline-start:auto;order:3}
.sp{height:40px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.2);display:none;place-items:center;z-index:9;padding:16px}.ov.open{display:grid}
.modal{background:#fff;border-radius:20px;width:min(560px,100%);padding:22px 26px}
.modal .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal h4{font-size:18px;margin:0}
.modal textarea{width:100%;height:170px;border:1px solid #e6e6ec;background:#f8f8f8;border-radius:6px;padding:12px;font:13px inherit;resize:none}
.modal .btn{margin-top:14px;padding:8px 24px;font-size:11px}.btn:disabled{background:#e0e2e7;color:#9a9aa0}
.x{border:0;background:none;font-size:20px;color:#201f4a;cursor:pointer}
@media(max-width:640px){.posts,.two{grid-template-columns:1fr}header nav,.search{display:none}header{justify-content:space-between}.status{position:static;margin-inline-start:auto}.name{font-size:22px}}
.name{min-height:34px}.role{min-height:28px}.line{min-height:28px}.loc{min-height:14px}.about{min-height:70px}.posts{min-height:220px;display:block}#streams-list{min-height:80px;margin-top:12px}#platforms-list{min-height:70px;margin-top:14px;margin-bottom:40px}.stats b{min-height:18px}</style></head><body>
<header><div class="logo">NEXO</div><div class="search">🔍 البحث</div><nav><a>الرئيسية</a><a>المواهب</a><a>الفرق والجهات</a><a>الفرص</a></nav><div class="ph"></div></header>
<main>
<div class="card"><div class="cover"></div><div class="head"><span class="pen">✎</span><div class="ph"></div>
<div class="name" id="p-name"></div><div class="line" id="p-role"></div><div class="loc" id="p-city"></div></div>
<div class="stats"><div><div class="ring"><i></i></div>اكتمال الملف</div><div><b></b>المشاهدات</div><div><b></b>شبكة التواصل</div></div></div>
<div class="card sec"><span class="pen">✎</span><h2>نبذة</h2><div class="about" id="p-bio"></div></div>
<div class="card sec"><div class="hd"><div><h2>منشورات</h2><div class="cnt">5 منشورات</div></div><button class="btn o" onclick="op()">✎ إنشاء منشور</button></div><div class="posts" id="posts-list"></div><div class="more">عرض الكل ‹</div></div>
<div class="card sec"><span class="pen">✎</span><h2>أبرز البثوث</h2><div id="streams-list"></div><div class="more">عرض الكل ‹</div></div>
<div class="two"><div class="card sec"><span class="pen">✎</span><h2>المنصات</h2><div id="platforms-list"></div><div class="more">عرض الكل ‹</div></div>
<div class="card sec"><span class="pen">✎</span><h2>حسابات التواصل</h2><a class="lnk">𝕏</a><a class="lnk">♪</a><div class="sp" style="height:14px"></div><div class="more">عرض الكل ‹</div></div></div>
</main><div class="ov" id="ov"><div class="modal"><div class="t"><button class="x" onclick="cl()">✕</button><h4>انشاء منشور</h4><span style="width:20px"></span></div><textarea id="ta" placeholder="شارك أفكارك مع مجتمع نيسكو"></textarea><button class="btn" id="pb" disabled onclick="cl()">نشر</button></div></div><script>var ta=document.getElementById("ta"),pb=document.getElementById("pb"),ov=document.getElementById("ov");function op(){ov.classList.add("open")}function cl(){ov.classList.remove("open");ta.value="";pb.disabled=true}ta.oninput=function(){pb.disabled=!ta.value.trim()};ov.onclick=function(e){if(e.target==ov)cl()}</script><template id="post-tpl"><div class="post"><div class="pt"><div class="ph"></div><div><b data-slot="author"></b><small data-slot="role"></small><small data-slot="time"></small></div></div><p data-slot="text"></p></div></template></body></html>
