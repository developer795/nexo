<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXO – إنشاء فرصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dash-profile.css">

<!-- إخفاء الصفحة حتى يتم التحقق من تسجيل الدخول -->
<style>html{visibility:hidden}</style>

<!-- حماية الصفحة: تسجيل الدخول + MFA -->
<script type="module" src="js/auth-guard.js"></script>
</head>
<body>
<nav class="top">
 <a class="logo" href="dash-home.html" aria-label="NEXO"><img src="assets/logo.png" alt="NEXO"></a>
 <div class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input placeholder="البحث" aria-label="البحث"></div>
 <div class="links"><a href="dash-home.html">الرئيسية</a><a href="dash-talents.html">المواهب</a><a href="dash-teams.html">الفرق والجهات</a><a href="dash-opportunities.html">الفرص</a></div>
 <a class="nav-av" data-profile href="dash-entity-profile.html" aria-label="ملفي" style="text-decoration:none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
</nav>
<main>
<div class="crumb">ملف الجهة <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" ><path d="m15 18-6-6 6-6"/></svg> <b>إنشاء فرصة</b></div><h1 class="pg">إنشاء فرصة</h1>
<div class="f"><label>نوع الفرصة</label><div class="sub">اختر نوع الفرصة التي ترغب في تقديمها</div><div class="opts" id="types"><button type="button" class="opt" aria-pressed="true" data-v="عقد عمل">عقد عمل</button><button type="button" class="opt" aria-pressed="false" data-v="تدريب تعاوني">تدريب تعاوني</button><button type="button" class="opt" aria-pressed="false" data-v="تدريب مهني">تدريب مهني</button><button type="button" class="opt" aria-pressed="false" data-v="حملة إعلانية">حملة إعلانية</button><button type="button" class="opt" aria-pressed="false" data-v="مشاركة في بطولة">مشاركة في بطولة</button></div></div>
<div class="f"><label>الفئة</label><div class="sub">حدد الفئة المستهدفة لهذه الفرصة</div><div class="opts c3" id="cats"><button type="button" class="opt" aria-pressed="false" data-v="اللاعبين">اللاعبين</button><button type="button" class="opt" aria-pressed="false" data-v="صناع المحتوى">صناع المحتوى</button><button type="button" class="opt" aria-pressed="true" data-v="ستريمرز">ستريمرز</button></div></div>
<div class="two"><div class="f"><label for="oname">اسم الفرصة</label><input id="oname" placeholder="اسم الفرصة"></div>
<div class="f"><label for="ocity">المدينة</label><select id="ocity" required><option value="" disabled selected hidden>المدينة</option><option>الرياض</option><option>جدة</option><option>الدمام</option><option>مكة المكرمة</option><option>المدينة المنورة</option></select></div></div>
<div class="f"><label for="odesc">الوصف</label><textarea id="odesc" placeholder="اكتب تفاصيل الفرصة"></textarea></div>
<button class="btn" style="min-width:212px" id="opub">نشر الفرصة</button>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="js/profile-common.js"></script>
<script>
(function(){
  ['types','cats'].forEach(function(id){var g=document.getElementById(id);g.onclick=function(e){var b=e.target.closest('.opt');if(!b)return;[].forEach.call(g.children,function(x){x.setAttribute('aria-pressed',x===b)})}});
  document.getElementById('opub').onclick=function(){
    var n=document.getElementById('oname').value.trim(),c=document.getElementById('ocity').value,d=document.getElementById('odesc').value.trim();
    if(!n||!c||!d){toast('أكمل اسم الفرصة والمدينة والوصف');return}
    toast('تم نشر الفرصة');setTimeout(function(){location.href='dash-entity-profile.html'},900);
  };
})();
</script>
<script src="js/profile-data.js"></script>
</body>
</html>
